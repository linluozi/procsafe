name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: CLI smoke
        run: |
          procsafe --max-output 4096 -- python -c "print('smoke')"
          set +e
          procsafe --timeout 0.3 --grace 0.3 -- python -c "import time; time.sleep(30)"
          rc=$?
          test "$rc" -eq 124